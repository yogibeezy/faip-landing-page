<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // Redirect based on hostname
        const hostname = window.location.hostname;
        if (hostname === 'aa1.thefaip.com' || hostname === 'www.aa1.thefaip.com') {
            window.location.replace('/aa1/');
        } else if (hostname === 'aa2.thefaip.com' || hostname === 'www.aa2.thefaip.com') {
            window.location.replace('/aa2/');
        } else if (hostname === 'aa3.thefaip.com' || hostname === 'www.aa3.thefaip.com') {
            window.location.replace('/aa3/');
        } else {
            // Default to aa1 content
            window.location.replace('/aa1/');
        }
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
